<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Hoitajan näkymä{% endblock %} · Hyvinvointikumppani</title>
    <link rel="stylesheet" href="/static/hoitaja.css?v=20261013d">
    <script src="/static/hoitaja.js" defer></script>
  </head>
  <body>
    <div class="sovellus">
      <aside class="sivupalkki">
        <a class="brandi" href="/hoitaja/" aria-label="Hyvinvointikumppani">
          <img class="brandi-logo" src="/static/logo.png" alt="Hyvinvointikumppani – Hoitajan Kumppani">
        </a>

        <div class="sivupalkin-alaosa">
          <div class="sivupalkin-alatunniste">
            <span class="demo-kuvake" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.2c0 4.5 3.1 8.2 7.5 9.8 4.4-1.6 7.5-5.3 7.5-9.8V6L12 3Z"/><path d="m9 12 2 2 4-4"/></svg>
            </span>
            <div>
              <strong>Turvallinen demo</strong>
              <span>Vain synteettistä dataa</span>
            </div>
          </div>

          <nav class="paavalikko paavalikko-ala" aria-label="Järjestelmänavigaatio">
            <a class="valikko-linkki" href="/docs" target="_blank" rel="noopener">
              <span class="valikko-ikoni" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M7 4h7l4 4v12H7z"/><path d="M14 4v4h4M9.5 13h5M9.5 16h3"/></svg>
              </span>
              <span class="valikko-teksti">
                <span class="valikko-nimi">API-rajapinta</span>
                <span class="valikko-kuvaus">Swagger-dokumentaatio</span>
              </span>
            </a>
          </nav>
        </div>
      </aside>

      <div class="paaalue">
        <header class="ylapalkki">
          <div class="sijainti">
            <span class="sijainti-ylateksti">HYVINVOINTIKUMPPANI</span>
            <span class="sijainti-erotin" aria-hidden="true">/</span>
            <span>Hoitajan työpöytä</span>
          </div>
          <div class="ylapalkin-oikea">
            <span class="ymparisto"><span class="ymparisto-piste"></span> DEMOYMÄRISTÖ</span>
            <span class="roolimerkinta">Hoitajan näkymä</span>
          </div>
        </header>

        <main class="sisalto">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>
    <footer class="alatunniste">
      <div class="alatunniste-brandi">
        <img class="alatunniste-logo" src="/static/slogo.png" alt="Savon ammattiopisto">
      </div>
      <div class="alatunniste-tekijat">
        <span class="alatunniste-otsikko">Tekijät</span>
        <ul class="tekijalista">
          <li>Risto</li>
          <li>Justus</li>
          <li>Jere</li>
        </ul>
      </div>
      <div class="alatunniste-huomiot">
        <span>Demotiedot ovat synteettisiä</span>
        <span>Hoitaja arvioi tilanteen ja tekee päätökset</span>
      </div>
    </footer>
    <div class="ilmoitus" role="status" aria-live="polite" data-ilmoitus></div>
  </body>
</html>
